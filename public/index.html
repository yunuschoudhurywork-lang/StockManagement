<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-6xl px-4 py-8">
      <section class="mb-6">
        <p class="text-sm font-semibold uppercase tracking-wide text-blue-700">Internship Demo</p>
        <h1 class="mt-2 text-3xl font-bold">Student Management</h1>
        <p class="mt-2 max-w-2xl text-slate-600">
          Simple CRUD app using Tailwind CSS CDN, plain JavaScript, Node.js, Express.js, and MongoDB Atlas.
        </p>
      </section>

      <section class="grid gap-6 lg:grid-cols-[360px_1fr]">
        <form id="studentForm" class="rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
          <div class="mb-4 flex items-center justify-between">
            <h2 id="formTitle" class="text-xl font-semibold">Add Student</h2>
            <button
              id="cancelEditBtn"
              type="button"
              class="hidden rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
            >
              Cancel
            </button>
          </div>

          <input id="studentId" type="hidden" />

          <label class="mb-4 block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Name</span>
            <input
              id="name"
              class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
              placeholder="Anita Sharma"
              pattern="[a-zA-Z\s]{2,100}"
              title="Name must be 2-100 characters and contain only letters"
              minlength="2"
              maxlength="100"
              required
            />
          </label>

          <label class="mb-4 block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Email</span>
            <input
              id="email"
              type="email"
              class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
              placeholder="anita@example.com"
              maxlength="100"
              required
            />
          </label>

          <label class="mb-4 block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Course</span>
            <input
              id="course"
              class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
              placeholder="MERN Stack"
              minlength="2"
              maxlength="100"
              required
            />
          </label>

          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-1">
            <label class="block">
              <span class="mb-1 block text-sm font-medium text-slate-700">Phone</span>
              <input
                id="phone"
                class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                placeholder="1234567890"
                pattern="\d{10}"
                title="Phone number must be exactly 10 digits"
                maxlength="10"
                required
              />
            </label>

            <label class="block">
              <span class="mb-1 block text-sm font-medium text-slate-700">Age</span>
              <input
                id="age"
                type="number"
                min="16"
                max="100"
                class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                placeholder="21"
                required
              />
            </label>
          </div>

          <button
            id="submitBtn"
            class="mt-5 w-full rounded-md bg-blue-700 px-4 py-2.5 font-semibold text-white hover:bg-blue-800"
            type="submit"
          >
            Save Student
          </button>

          <p id="message" class="mt-4 hidden rounded-md px-3 py-2 text-sm"></p>
        </form>

        <section class="rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
          <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 class="text-xl font-semibold">Students</h2>
              <p id="studentCount" class="text-sm text-slate-500">Loading students...</p>
            </div>
            <button
              id="refreshBtn"
              class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
              type="button"
            >
              Refresh
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full min-w-[720px] border-collapse text-left text-sm">
              <thead>
                <tr class="border-b border-slate-200 bg-slate-50 text-slate-600">
                  <th class="px-3 py-3 font-semibold">Name</th>
                  <th class="px-3 py-3 font-semibold">Email</th>
                  <th class="px-3 py-3 font-semibold">Course</th>
                  <th class="px-3 py-3 font-semibold">Phone</th>
                  <th class="px-3 py-3 font-semibold">Age</th>
                  <th class="px-3 py-3 text-right font-semibold">Actions</th>
                </tr>
              </thead>
              <tbody id="studentsTable"></tbody>
            </table>
          </div>

          <div id="emptyState" class="hidden py-12 text-center text-slate-500">
            No students yet. Add the first student from the form.
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
